name: Daily Study Reminder

on:
  schedule:
    # Chay moi 2h tu 8h-22h VN (1h-15h UTC) de smart timing
    - cron: '0 1,3,5,7,9,11,13,15 * * *'
  workflow_dispatch:
    inputs:
      title:
        description: 'Notification title'
        required: false
        default: ''
      message:
        description: 'Custom message (leave empty for auto daily reminder)'
        required: false
        default: ''

jobs:
  send-reminder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install web-push
        run: npm install web-push

      - name: Send notifications
        env:
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          CUSTOM_TITLE: ${{ github.event.inputs.title }}
          CUSTOM_MESSAGE: ${{ github.event.inputs.message }}
        run: node scripts/send-reminder.js
