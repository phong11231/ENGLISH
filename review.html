<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlashMind — Review</title>
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#8b5cf6">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/fm.css?v=2">
</head>
<body>

<div class="app active" id="appShell">
<nav class="nav">
  <div class="nav-brand"><span>🧠</span> FlashMind</div>
  <div class="nav-actions">
    <button class="nav-btn" onclick="showView('decks')" title="Decks" id="navDecks">📚</button>
    <button class="nav-btn" onclick="showView('quiz')" title="Quiz" id="navQuiz">🎯</button>
    <button class="nav-btn" onclick="showView('stats')" title="Stats" id="navStats">📊</button>
    <button class="nav-btn" onclick="toggleTheme()" title="Theme" id="navTheme">🌙</button>
    <button class="nav-btn" onclick="openAuthModal()" title="Sign in" id="navLogin">👤</button>
    <img class="user-avatar" id="userAvatar" onclick="toggleUserMenu()" alt="avatar" style="display:none">
    <div class="user-avatar user-avatar-initial" id="userAvatarInitial" onclick="toggleUserMenu()" style="display:none"></div>
  </div>
  <div class="user-menu" id="userMenu">
    <div class="user-menu-name" id="userName"></div>
    <button class="user-menu-item" onclick="syncToCloud()">☁️ Sync to cloud</button>
    <button class="user-menu-item danger" onclick="signOutUser()">🚪 Sign out</button>
  </div>
</nav>

<main class="main">
<div class="view active" id="viewReview">
  <div class="review-container" style="position:relative">
    <div class="review-header" style="width:100%;display:flex;align-items:center;gap:8px;margin-bottom:4px;flex-wrap:wrap">
      <button class="btn btn-ghost btn-sm" onclick="exitReview()">← Back</button>
      <button class="btn btn-ghost btn-sm" id="undoBtn" style="display:none" onclick="undoAnswer()">↩ Previous</button>
      <h2 style="font-size:15px;font-weight:700;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis" id="reviewDeckName"></h2>
      <div class="streak-bar" id="streakBar" style="margin:0;padding:4px 12px;max-width:none;width:auto;flex:none">
        <div class="streak-combo" id="streakCombo"><div class="streak-fire" id="streakFire">🔥</div><div class="streak-count" id="streakCount">0</div></div>
        <div class="streak-xp" id="streakXp">⚡ <span id="sessionXp">0</span> XP</div>
        <div class="streak-multiplier" id="streakMultiplier">x1</div>
      </div>
      <div class="mode-toggle" id="modeIndicator" style="pointer-events:none;margin-bottom:0;flex:none">
        <button id="modeFlip">🔄 Flip card</button>
        <button id="modeType">⌨️ Type answer</button>
      </div>
      <div class="review-counts" style="display:flex;gap:8px;font-size:12px;flex:none">
        <span class="cnt-new" id="cntNew">0 new</span>
        <span class="cnt-learn" id="cntLearn">0 learning</span>
        <span class="cnt-due" id="cntDue">0 review</span>
      </div>
    </div>
    <div class="review-progress">
      <div class="review-progress-bar"><div class="review-progress-fill" id="reviewProgressFill"></div></div>
    </div>
    <div class="streak-popup" id="streakPopup"></div>
    <div class="flashcard" id="flashcard" onclick="flipCard()">
      <div class="flashcard-inner">
        <div class="flashcard-face front">
          <div class="flashcard-label">Question</div>
          <div class="flashcard-content" id="cardFront"></div>
          <div class="flashcard-tags" id="cardTags"></div>
          <div class="flashcard-hint">Tap to see answer · Space</div>
        </div>
        <div class="flashcard-face back">
          <div class="flashcard-label">Answer</div>
          <div class="flashcard-content" id="cardBack"></div>
        </div>
      </div>
    </div>
    <div class="review-actions" id="reviewActions" style="display:none">
      <button class="review-btn again" onclick="answerCard(0)">Again<span class="interval" id="intAgain"></span></button>
      <button class="review-btn hard" onclick="answerCard(1)">Hard<span class="interval" id="intHard"></span></button>
      <button class="review-btn good" onclick="answerCard(2)">Good<span class="interval" id="intGood"></span></button>
      <button class="review-btn easy" onclick="answerCard(3)">Easy<span class="interval" id="intEasy"></span></button>
    </div>
    <div class="type-answer-wrap" id="typeAnswerWrap" style="display:none">
      <input type="text" class="type-answer-input" id="typeAnswerInput" placeholder="Type your answer..." autocomplete="off">
      <div class="type-answer-result" id="typeAnswerResult"></div>
    </div>
    <button class="btn-check-answer" id="btnCheckAnswer" style="display:none" onclick="checkTypedAnswer()">Check (Enter)</button>
    <button class="btn-next-card" id="btnNextCard" style="display:none" onclick="nextAfterType()">Next card → (Enter)</button>
    <div class="review-done" id="reviewDone" style="display:none">
      <div class="done-icon">🎉</div>
      <h2>Complete!</h2>
      <div class="done-stats" id="doneStats"></div>
      <button class="btn btn-primary" onclick="exitReview()">Back to decks</button>
    </div>
  </div>
</div>
</main>
</div>

<!-- SLEEP LISTEN OVERLAY -->
<div id="sleepListenOverlay" style="display:none;position:fixed;inset:0;z-index:9999;background:#000;flex-direction:column">
  <div style="display:flex;align-items:center;gap:12px;padding:12px 16px;background:rgba(255,255,255,0.05)">
    <button class="btn btn-ghost btn-sm" onclick="stopSleepListen()" style="color:#fff">✕ Exit</button>
    <span style="flex:1;color:#fff;font-size:14px;font-weight:600" id="sleepListenTitle">🌙 Sleep Listen</span>
    <span style="color:rgba(255,255,255,0.5);font-size:13px" id="sleepListenCounter">0 / 0</span>
  </div>
  <div style="flex:1;display:flex;align-items:center;justify-content:center;padding:16px">
    <div id="sleepListenPlayer" style="width:100%;max-width:900px;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#111"></div>
  </div>
  <div style="display:flex;align-items:center;justify-content:center;gap:16px;padding:12px 16px;background:rgba(255,255,255,0.05)">
    <button class="btn btn-ghost btn-sm" onclick="sleepListenPrev()" style="color:#fff;font-size:18px">⏮</button>
    <button class="btn btn-ghost btn-sm" onclick="sleepListenReplay()" style="color:#fff;font-size:18px">🔄</button>
    <button class="btn btn-ghost btn-sm" onclick="sleepListenNext()" style="color:#fff;font-size:18px">⏭</button>
    <span style="width:1px;height:20px;background:rgba(255,255,255,0.2)"></span>
    <button class="btn btn-ghost btn-sm" onclick="sleepChangeSpeed(-0.25)" style="color:#fff;font-size:14px">−</button>
    <span style="color:#fff;font-size:14px;font-weight:700;min-width:40px;text-align:center" id="sleepSpeedLabel">1.5x</span>
    <button class="btn btn-ghost btn-sm" onclick="sleepChangeSpeed(0.25)" style="color:#fff;font-size:14px">+</button>
  </div>
  <div style="display:flex;align-items:center;justify-content:center;gap:10px;padding:4px 16px;flex-wrap:wrap">
    <button class="btn btn-ghost btn-sm" id="sleepDrillBtn" onclick="toggleSleepDrill()" style="color:rgba(255,255,255,0.5);font-size:12px;border:1px solid rgba(255,255,255,0.15);border-radius:20px;padding:4px 12px">🔄 Speed Drill: OFF</button>
    <button class="btn btn-ghost btn-sm" onclick="openTelegramSend()" style="color:rgba(255,255,255,0.5);font-size:12px;border:1px solid rgba(255,255,255,0.15);border-radius:20px;padding:4px 12px">📻 Telegram</button>
    <span style="color:rgba(255,255,255,0.3);font-size:11px" id="sleepDrillInfo"></span>
  </div>
  <div style="padding:4px 16px 8px;text-align:center">
    <span style="color:rgba(255,255,255,0.4);font-size:12px" id="sleepListenCardName"></span>
  </div>
</div>

<!-- TELEGRAM MODAL -->
<div id="telegramModal" style="display:none;position:fixed;inset:0;z-index:10000;background:rgba(0,0,0,0.8);align-items:center;justify-content:center">
  <div style="background:#1a1a2e;border-radius:16px;padding:24px;max-width:380px;width:90%;color:#fff">
    <h3 style="margin:0 0 8px;font-size:18px">📻 Send to Telegram</h3>
    <p style="margin:0 0 16px;font-size:13px;color:rgba(255,255,255,0.6)">Send current playlist to your Telegram as audio files.</p>
    <label style="font-size:12px;color:rgba(255,255,255,0.5)">Chat ID</label>
    <input id="teleChatId" type="text" placeholder="e.g. 123456789" style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.08);color:#fff;font-size:14px;margin:4px 0 12px;box-sizing:border-box">
    <input id="teleBotUrl" type="hidden" value="https://flashmind-tele-bot.yosua-4131.workers.dev">
    <label style="font-size:12px;color:rgba(255,255,255,0.5)">Admin Key</label>
    <input id="teleAdminKey" type="password" placeholder="Your ADMIN_KEY" style="width:100%;padding:10px 12px;border-radius:8px;border:1px solid rgba(255,255,255,0.15);background:rgba(255,255,255,0.08);color:#fff;font-size:14px;margin:4px 0 16px;box-sizing:border-box">
    <div id="teleSendStatus" style="font-size:13px;color:rgba(255,255,255,0.5);margin-bottom:12px;min-height:18px"></div>
    <div style="display:flex;gap:10px">
      <button onclick="closeTelegramModal()" style="flex:1;padding:10px;border-radius:8px;border:1px solid rgba(255,255,255,0.15);background:transparent;color:#fff;cursor:pointer;font-size:14px">Cancel</button>
      <button id="teleSendBtn" onclick="sendToTelegram()" style="flex:1;padding:10px;border-radius:8px;border:none;background:#0088cc;color:#fff;cursor:pointer;font-size:14px;font-weight:600">Send 📨</button>
    </div>
  </div>
</div>

<!-- AUTH MODAL -->
<div class="modal-overlay" id="authModal">
  <div class="modal" style="max-width:380px">
    <div class="modal-header"><h2 id="authModalTitle">Sign In</h2><button class="modal-close" onclick="closeAuthModal()">✕</button></div>
    <div class="modal-body">
      <div class="form-group"><label>Username</label><input type="text" id="authEmail" placeholder="Choose any name" autocomplete="username"></div>
      <div class="form-group"><label>Password</label><input type="password" id="authPass" placeholder="Min 6 characters" autocomplete="current-password"></div>
      <div id="authNameGroup" class="form-group" style="display:none"><label>Display name</label><input type="text" id="authName" placeholder="Your name"></div>
      <div id="authError" style="color:var(--red);font-size:13px;margin-top:4px;display:none"></div>
      <div class="form-actions" style="flex-direction:column;gap:8px">
        <button class="btn btn-primary" id="authSubmitBtn" onclick="submitAuth()" style="width:100%">Sign In</button>
        <div style="text-align:center;font-size:13px;opacity:.7;margin-top:4px">
          <span id="authToggleText">Don't have an account?</span>
          <a href="#" onclick="toggleAuthMode(event)" style="color:var(--primary);text-decoration:underline" id="authToggleLink">Sign Up</a>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="js/fm-shared.js?v=2"></script>
<script>
var _params = new URLSearchParams(location.search);
var _deckId = _params.get('deck');
var _mode = _params.get('mode');
if(!_deckId) location.href='index.html';
var _reviewStarted = false;

function pageRender(){
  if(!_deckId) return;
  if(!db.decks[_deckId]){
    var rdn=document.getElementById('reviewDeckName');
    if(rdn) rdn.textContent='Loading...';
    return;
  }
  if(_reviewStarted) return;
  _reviewStarted = true;
  currentDeckId = _deckId;
  var cards;
  var label = db.decks[_deckId].name;
  if(_mode==='all'){
    cards = getAllCardsRecursive(_deckId).filter(function(c){return !c.suspended;});
    label += ' (All)';
  } else if(_mode==='custom'){
    cards = getAllCardsRecursive(_deckId).filter(function(c){return !c.suspended;});
    var filter = _params.get('filter')||'all';
    var tag = _params.get('tag')||'';
    if(filter==='difficult') cards=cards.filter(function(c){return c.ease<2;});
    else if(filter==='leech') cards=cards.filter(function(c){return c.leech;});
    else if(filter==='new') cards=cards.filter(function(c){return c.status==='new';});
    else if(filter==='tag') cards=cards.filter(function(c){return (c.tags||[]).indexOf(tag)>=0;});
    var order = _params.get('order')||'random';
    if(order==='due') cards.sort(function(a,b){return a.due-b.due;});
    else if(order==='added') cards.sort(function(a,b){return b.created-a.created;});
    else if(order==='difficulty') cards.sort(function(a,b){return a.ease-b.ease;});
    var limit = parseInt(_params.get('limit'))||50;
    cards = cards.slice(0, limit);
    label += ' (Custom)';
  } else {
    cards = getDeckCards(_deckId).filter(function(c){return !c.suspended;});
  }
  if(cards.length===0){
    toast('No cards to review!');
    location.href='deck.html?id='+_deckId;
    return;
  }
  reviewQueue = cards.slice();
  for(var i=reviewQueue.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var tmp=reviewQueue[i];reviewQueue[i]=reviewQueue[j];reviewQueue[j]=tmp;}
  reviewIndex = 0;
  undoStack = [];
  streak=0;bestStreak=0;sessionXp=0;sessionCorrect=0;sessionTotal=0;
  var fabEl=document.getElementById('fabBtn');
  if(fabEl) fabEl.style.display='none';
  document.getElementById('reviewDone').style.display='none';
  document.getElementById('undoBtn').style.display='none';
  document.getElementById('reviewDeckName').textContent = label;
  updateStreakUI();
  showCurrentCard();
  document.title = 'FlashMind — ' + db.decks[_deckId].name;
}
pageRender();
</script>
</body>
</html>
