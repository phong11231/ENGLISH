<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FlashMind — Statistics</title>
<link rel="icon" href="../icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="../apple-touch-icon.png">
<meta name="theme-color" content="#8b5cf6">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/fm.css?v=6">
</head>
<body>

<div class="app active" id="appShell">
<nav class="nav">
  <div class="nav-brand"><span>🧠</span> FlashMind</div>
  <div class="nav-actions">
    <button class="nav-btn" onclick="showView('decks')" title="Decks" id="navDecks">📚</button>
    <button class="nav-btn" onclick="showView('review')" title="Review" id="navReview">🔄</button>
    <button class="nav-btn" onclick="showView('quiz')" title="Quiz" id="navQuiz">🎯</button>
    <button class="nav-btn" onclick="location.href=(_basePath||'/')+'quizy'" title="Quizy" id="navQuizy">⚡</button>
    <button class="nav-btn active" onclick="showView('stats')" title="Stats" id="navStats">📊</button>
    <button class="nav-btn" onclick="toggleTheme()" title="Theme" id="navTheme">🌙</button>
    <button class="nav-btn" onclick="openAuthModal()" title="Sign in" id="navLogin">👤</button>
    <img class="user-avatar" id="userAvatar" onclick="toggleUserMenu()" alt="avatar" style="display:none">
    <div class="user-avatar user-avatar-initial" id="userAvatarInitial" onclick="toggleUserMenu()" style="display:none"></div>
  </div>
  <div class="user-menu" id="userMenu">
    <div class="user-menu-name" id="userName"></div>
    <button class="user-menu-item" onclick="syncToCloud()">☁️ Sync to cloud</button>
    <button class="user-menu-item danger" onclick="signOutUser()">🚪 Sign out</button>
  </div>
</nav>

<main class="main">
<div class="view active" id="viewStats">
  <div class="page-header"><h1>Statistics</h1><p>Your study progress</p></div>
  <div class="stats-row" id="detailedStats"></div>
  <div style="background:var(--surface);border-radius:var(--r-lg);border:1px solid var(--line);padding:24px;margin-top:16px">
    <h3 style="font-size:16px;font-weight:700;margin-bottom:16px">Review history — last 30 days</h3>
    <div id="heatmapContainer" style="overflow-x:auto"></div>
  </div>
  <div style="background:var(--surface);border-radius:var(--r-lg);border:1px solid var(--line);padding:24px;margin-top:12px">
    <h3 style="font-size:16px;font-weight:700;margin-bottom:16px">Card distribution by status</h3>
    <div id="statusChart"></div>
  </div>
</div>
</main>
</div>

<!-- AUTH MODAL -->
<div class="modal-overlay" id="authModal">
  <div class="modal" style="max-width:380px">
    <div class="modal-header"><h2 id="authModalTitle">Sign In</h2><button class="modal-close" onclick="closeAuthModal()">✕</button></div>
    <div class="modal-body">
      <div class="form-group"><label>Username</label><input type="text" id="authEmail" placeholder="Choose any name" autocomplete="username"></div>
      <div class="form-group"><label>Password</label><input type="password" id="authPass" placeholder="Min 6 characters" autocomplete="current-password"></div>
      <div id="authNameGroup" class="form-group" style="display:none"><label>Display name</label><input type="text" id="authName" placeholder="Your name"></div>
      <div id="authError" style="color:var(--red);font-size:13px;margin-top:4px;display:none"></div>
      <div class="form-actions" style="flex-direction:column;gap:8px">
        <button class="btn btn-primary" id="authSubmitBtn" onclick="submitAuth()" style="width:100%">Sign In</button>
        <div style="text-align:center;font-size:13px;opacity:.7;margin-top:4px">
          <span id="authToggleText">Don't have an account?</span>
          <a href="#" onclick="toggleAuthMode(event)" style="color:var(--primary);text-decoration:underline" id="authToggleLink">Sign Up</a>
        </div>
      </div>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<!-- Firebase SDK -->
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="../js/fm-shared.js?v=32"></script>
<script>
function pageRender(){
  renderStats();
  updateAdminUI();
}
pageRender();
</script>
</body>
</html>
